<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELKASS — Produkt clean</title><style>

</head><body><main class="wrap"><a href="index.html">← Panel</a><section class="card"><h1>📦 Dodaj produkt krok po kroku</h1><p class="note">Docelowy kreator produktu. Zapisuje do Supabase po aktywacji chmury albo lokalnie w trybie fallback.</p><div class="grid"><label>Nazwa<input id="name" placeholder="np. Lodówka TCL RP318BXE2"></label><label>Kategoria<input id="category" placeholder="np. AGD / Lodówki"></label><label>ID kategorii<input id="category_id" placeholder="np. lodowki"></label><label>Cena<input id="price" placeholder="1699,00 zł"></label><label>Stara cena<input id="old_price" placeholder="1931,00 zł"></label><label>Zdjęcie<input id="image" placeholder="assets/products/lodowka-tcl.png"></label><label>Status<select id="badge"><option>Dostępny w sklepie</option><option>Na zamówienie</option><option>Promocja</option><option>Hit dnia</option></select></label><label>Tryb sprzedaży<select id="sale_mode"><option value="inquiry">Zapytaj o produkt</option><option value="buy">Kup teraz</option><option value="cart">Dodaj do koszyka</option></select></label></div><label>Krótki opis premium<textarea id="lead" placeholder="Krótki opis widoczny obok ceny."></textarea></label><label>Pełny opis do strony i PDF<textarea id="description" placeholder="Pełny opis produktu do karty i wydruku PDF."></textarea></label><label>Cechy po przecinku<input id="features" placeholder="No Frost, Pojemna chłodziarka, Cicha praca"></label><button id="save">Zapisz produkt</button><pre id="out"></pre></section></main><script src="../cloud-config.js"></script><script src="../js/elkass-66-cloud-foundation.js"></script><script>function slugify(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}save.onclick=async()=>{const id=slugify(name.value);const p={id,slug:id,name:name.value,category:category.value,category_id:category_id.value,price:price.value,old_price:old_price.value,oldPrice:old_price.value,image:image.value,badge:badge.value,sale_mode:sale_mode.value,lead:lead.value,description:description.value,features:features.value.split(',').map(x=>x.trim()).filter(Boolean),active:true};const r=await ELKASSCloud.save('products',p);out.textContent=JSON.stringify(r,null,2);};</script><script src="../js/elkass-702-cms-clean-foundation.js?v=702"></script>
