<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELKASS — Dodaj produkt krok po kroku</title>
<link rel="stylesheet" href="../js/elkass-65-cms-ux-fix.css">
<style>
body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#07111f}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:white;border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(15,23,42,.09)}h1{font-size:38px;letter-spacing:-.05em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:900;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:14px;padding:13px;font:inherit;margin-top:7px}textarea{min-height:120px}button{border:0;border-radius:18px;background:#e30613;color:white;font-weight:1000;padding:14px 18px;margin-top:16px}.note{color:#64748b;line-height:1.5}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:30px}}
</style>
<link rel="stylesheet" href="../js/elkass-65-product-premium.css?v=65">
<link rel="stylesheet" href="../js/elkass-651-foundation-stabilization.css?v=651">
</head>
<body>
<main class="wrap">
<a href="index.html">← Panel</a>
<section class="card">
<h1>📦 Dodaj produkt krok po kroku</h1>
<p class="note">Na razie zapisuje lokalnie lub do chmury, gdy ustawisz Supabase. To samo później będzie działać z telefonu i komputera.</p>
<div class="grid">
<label>Nazwa produktu<input id="name" placeholder="np. Pralka BEKO WUE7636XOA"></label>
<label>Kategoria<input id="category" placeholder="np. AGD / Pralki"></label>
<label>Cena<input id="price" placeholder="np. 1349,00 zł"></label>
<label>Stara cena<input id="oldPrice" placeholder="np. 1606,00 zł"></label>
<label>Zdjęcie / URL<input id="image" placeholder="assets/products/pralka.png"></label>
<label>Badge<select id="badge"><option>Dostępny w sklepie</option><option>Promocja</option><option>Hit dnia</option><option>Nowość</option></select></label>
</div>
<label>Najważniejszy opis produktu<textarea id="description" placeholder="Opisz po ludzku: dla kogo jest produkt, co daje klientowi i dlaczego warto kupić lokalnie w ELKASS."></textarea></label>
<label>Cechy, po przecinku<input id="features" placeholder="7 kg załadunku, 1200 obr./min, program szybki"></label>
<button id="save">Zapisz produkt</button>
<pre id="out"></pre>
</section>
</main>
<script src="../cloud-config.js"></script>
<script src="../js/elkass-65-cloud-client.js"></script>
<script>
function slugify(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
document.getElementById('save').onclick=async()=>{
 const p={id:slugify(name.value),slug:slugify(name.value),name:name.value,category:category.value,price:price.value,oldPrice:oldPrice.value,image:image.value,badge:badge.value,description:description.value,lead:description.value,features:features.value.split(',').map(x=>x.trim()).filter(Boolean)};
 const r=await ELKASSCloud.save('products',p);
 out.textContent='Zapisano: '+JSON.stringify(r,null,2);
};
</script>
<script src="../js/elkass-65-product-premium.js?v=65"></script>
<script src="../js/elkass-65-cms-ux-fix.js?v=65"></script>
<script src="../js/elkass-651-foundation-stabilization.js?v=651"></script>
</body></html>
