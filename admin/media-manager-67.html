<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELKASS — Media Cloud 6.7</title><style>body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#07111f}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(15,23,42,.09);margin-bottom:16px}h1{font-size:38px;letter-spacing:-.05em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{border:1px solid #e5e7eb;border-radius:18px;padding:16px;background:#f8fafc}input,select{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:14px;margin-top:8px}button{border:0;border-radius:16px;background:#e30613;color:#fff;font-weight:1000;padding:13px 18px;margin-top:12px}pre{white-space:pre-wrap;background:#f8fafc;border-radius:16px;padding:14px}</style><link rel="stylesheet" href="../js/elkass-67-priority-ab.css?v=67">
<link rel="stylesheet" href="../js/elkass-701-premium-product-pdf-safe.css?v=701">
</head><body><main class="wrap"><a href="index.html">← Panel</a><section class="card"><h1>🖼️ Media Cloud 6.7</h1><p>Po włączeniu Supabase zapisuje grafiki do bucketu <b>elkass-media</b>. Bez chmury działa informacyjnie.</p><label>Typ grafiki<select id="type"><option value="hero">Hero</option><option value="category">Kategoria</option><option value="subcategory">Podkategoria</option><option value="product">Produkt</option><option value="gallery">Galeria</option><option value="social">Social</option></select></label><label>Plik<input id="file" type="file" accept="image/*"></label><button id="upload">Wyślij do chmury</button><pre id="out"></pre></section><section class="card"><h2>Ścieżki lokalne przed chmurą</h2><div class="grid"><div class="item"><b>Hero</b><br>assets/hero-seasonal-real/</div><div class="item"><b>Kategorie</b><br>assets/categories/</div><div class="item"><b>Produkty</b><br>assets/products/</div><div class="item"><b>Galeria</b><br>assets/gallery/</div></div></section></main><script src="../cloud-config.js"></script><script src="../js/elkass-66-cloud-foundation.js"></script><script>function safe(n){return String(n||'file').toLowerCase().replace(/[^a-z0-9.]+/g,'-')}upload.onclick=async()=>{const f=file.files[0];if(!f){out.textContent='Wybierz plik.';return;}const path=type.value+'/'+Date.now()+'-'+safe(f.name);const r=await ELKASSCloud.uploadMedia(path,f,{type:type.value,label:f.name,target:type.value});out.textContent=JSON.stringify(r,null,2);};</script><script src="../js/elkass-67-priority-ab.js?v=67"></script>
<script src="../js/elkass-701-premium-product-pdf-safe.js?v=701"></script>
</body></html>
