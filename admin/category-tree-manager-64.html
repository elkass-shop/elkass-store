</head><body><main class="wrap"><h1>📂 Kategorie i podkategorie</h1><p>Włącz/ukryj kategorię, zmień nazwę, opis premium i ścieżkę grafiki. Na stronie głównej wyświetla się 6 głównych kategorii.</p><div class="tools"><button id="save">Zapisz lokalnie</button><button id="export">Eksport JSON</button><button onclick="location.href='foundation-64.html'">Wróć</button></div><section id="tree"></section></main><script src="../js/elkass-64-foundation.js"></script><script>function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}let data=null;function render(items,depth=0){return (items||[]).map(n=>`<div class="row ${depth?'child':''}" data-id="${n.id}"><h3>${esc(n.name)}</h3><label><input type="checkbox" class="active" ${n.active!==false?'checked':''}> Aktywna</label> <label><input type="checkbox" class="home" ${n.showOnHome!==false?'checked':''}> Strona główna</label><p>Nazwa</p><input class="name" value="${esc(n.name)}"><p>Grafika</p><input class="image" value="${esc(n.image)}"><p>Opis premium</p><textarea class="desc">${esc(n.premiumDescription)}</textarea>${render(n.children,depth+1)}</div>`).join('')}function collect(items){(items||[]).forEach(n=>{const el=document.querySelector(`[data-id="${n.id}"]`);if(el){n.active=el.querySelector('.active').checked;n.showOnHome=el.querySelector('.home').checked;n.name=el.querySelector('.name').value;n.image=el.querySelector('.image').value;n.premiumDescription=el.querySelector('.desc').value}collect(n.children)})}ELKASS64.loadTree().then(t=>{data=t;document.getElementById('tree').innerHTML=render(data.items)});document.getElementById('save').onclick=()=>{collect(data.items);ELKASS64.saveTree(data);alert('Zapisano lokalnie w przeglądarce')};document.getElementById('export').onclick=()=>{collect(data.items);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='category-tree.json';a.click()};</script><script
