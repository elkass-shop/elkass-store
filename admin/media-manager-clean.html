<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELKASS — Media clean</title><style>
body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#07111f}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(15,23,42,.09);margin-bottom:16px}h1{font-size:38px;letter-spacing:-.05em}label{display:block;font-weight:900;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:14px;padding:13px;font:inherit;margin-top:7px}textarea{min-height:110px}button,.btn{border:0;border-radius:18px;background:#e30613;color:white;font-weight:1000;padding:14px 18px;margin-top:16px;text-decoration:none;display:inline-flex}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.note{color:#64748b;line-height:1.5}pre{white-space:pre-wrap;background:#f8fafc;border-radius:16px;padding:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:30px}}
</style><link rel="stylesheet" href="../js/elkass-702-cms-clean-foundation.css?v=702">
</head><body><main class="wrap"><a href="index.html">← Panel</a><section class="card"><h1>🖼️ Media Manager clean</h1><p class="note">Jedno miejsce do grafik. Po aktywacji Supabase pliki idą do bucketu <b>elkass-media</b>.</p><div class="grid"><label>Typ<select id="type"><option value="hero">Hero</option><option value="category">Kategoria</option><option value="subcategory">Podkategoria</option><option value="product">Produkt</option><option value="gallery">Galeria</option><option value="seasonal">Motyw sezonowy</option><option value="social">Social</option></select></label><label>Cel / ID<input id="target" placeholder="np. lodowki albo lodowka-tcl"></label></div><label>Plik<input id="file" type="file" accept="image/*"></label><button id="upload">Wyślij do chmury</button><pre id="out"></pre></section></main><script src="../cloud-config.js"></script><script src="../js/elkass-66-cloud-foundation.js"></script><script>function safe(n){return String(n||'file').toLowerCase().replace(/[^a-z0-9.]+/g,'-')}upload.onclick=async()=>{const f=file.files[0];if(!f){out.textContent='Wybierz plik.';return;}const path=type.value+'/'+(target.value||'general')+'/'+Date.now()+'-'+safe(f.name);const r=await ELKASSCloud.uploadMedia(path,f,{type:type.value,label:f.name,target:target.value});out.textContent=JSON.stringify(r,null,2);};</script><script src="../js/elkass-702-cms-clean-foundation.js?v=702"></script>
<script src="../js/elkass-703-supabase-production.js?v=703"></script>
</body></html>
