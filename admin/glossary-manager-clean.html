</head><body><main class="wrap"><a href="index.html">← Panel</a><section class="card"><h1>📚 Biblioteka terminów</h1><p class="note">Hasło + definicja do opisów produktów, SEO i PDF.</p><label>Hasło<input id="term" placeholder="No Frost"></label><label>Definicja<textarea id="definition" placeholder="Wyjaśnienie dla klienta."></textarea></label><button id="save">Zapisz termin</button><div id="list"></div></section></main><script src="../cloud-config.js"></script><script src="../js/elkass-66-cloud-foundation.js"></script><script>function slugify(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}async function load(){const a=await ELKASSCloud.list('glossary');list.innerHTML=(a||[]).map(x=>'<div class="card"><b>'+x.term+'</b><p>'+x.definition+'</p></div>').join('');}save.onclick=async()=>{await ELKASSCloud.save('glossary',{id:slugify(term.value),term:term.value,definition:definition.value,active:true});term.value='';definition.value='';load();};load();</script><script src="../js/elkass-702-cms-clean-foundation.js?v=702"></script>
