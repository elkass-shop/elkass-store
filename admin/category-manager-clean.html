body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#07111f}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(15,23,42,.09);margin-bottom:16px}h1{font-size:38px;letter-spacing:-.05em}label{display:block;font-weight:900;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:14px;padding:13px;font:inherit;margin-top:7px}textarea{min-height:110px}button,.btn{border:0;border-radius:18px;background:#e30613;color:white;font-weight:1000;padding:14px 18px;margin-top:16px;text-decoration:none;display:inline-flex}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.note{color:#64748b;line-height:1.5}pre{white-space:pre-wrap;background:#f8fafc;border-radius:16px;padding:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:30px}}

</head><body><main class="wrap"><a href="index.html">← Panel</a><section class="card"><h1>📂 Kategorie i podkategorie</h1><p class="note">Jeden docelowy manager kategorii. Obsługuje aktywność, rodzica, grafikę i opis premium.</p><div class="grid"><label>Nazwa<input id="name" placeholder="np. Lodówki"></label><label>ID rodzica<input id="parent_id" placeholder="np. agd albo puste"></label><label>Grafika<input id="image" placeholder="assets/categories/agd.jpg"></label><label>Na głównej?<select id="showOnHome"><option value="false">Nie</option><option value="true">Tak</option></select></label></div><label>Opis premium<textarea id="description"></textarea></label><button id="save">Zapisz kategorię</button><pre id="out"></pre></section></main><script src="../cloud-config.js"></script><script src="../js/elkass-66-cloud-foundation.js"></script><script>function slugify(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}save.onclick=async()=>{const id=slugify(name.value);const r=await ELKASSCloud.save('categories',{id,slug:id,name:name.value,parent_id:parent_id.value||null,image:image.value,premiumDescription:description.value,description:description.value,showOnHome:showOnHome.value==='true',active:true});out.textContent=JSON.stringify(r,null,2);};</script><script src="../js/elkass-702-cms-clean-foundation.js?v=702"></script>
