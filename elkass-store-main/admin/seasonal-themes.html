<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motywy sezonowe ELKASS 5.4</title><style>body{font-family:Arial;background:#eef2f7;margin:0}main{max-width:1000px;margin:auto;padding:24px}.box{background:white;border-radius:24px;padding:24px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}button{border:0;border-radius:14px;padding:14px;background:#e30613;color:white;font-weight:900;cursor:pointer}.black{background:#111;color:#ffcc00}.cyber{background:#0ea5e9}.soft{background:#8bc34a;color:#111}</style></head><body><main><div class=box><h1>🎨 Motywy sezonowe 5.4</h1><p>Bez kropek. Realistyczne tła, śnieg, liście, neon, Black Week i pory roku.</p><div class=grid id=g></div><p><a href="../index.html">↗ Podgląd strony</a></p></div></main><script>const list=[['standard','Standard'],['christmas','🎄 Boże Narodzenie'],['black','⚫ Black Week'],['cyber','💻 Cyber Week'],['easter','🐣 Wielkanoc'],['spring','🌸 Wiosna'],['summer','☀️ Lato'],['autumn','🍂 Jesień'],['winter','❄️ Zima']];g.innerHTML=list.map(x=>`<button class="${x[0]}" onclick="localStorage.setItem('elkassSeasonalTheme',JSON.stringify({theme:'${x[0]}'}));alert('Zapisano: ${x[1]}')">${x[1]}</button>`).join('')</script></body></html>
